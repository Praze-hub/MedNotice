<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MedNotice{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            padding: 40px 20px;
            color: #333333;
        }
        .wrapper {
            max-width: 620px;
            margin: 0 auto;
        }
        .brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand-name {
            font-size: 26px;
            font-weight: 800;
            color: #1a73e8;
            letter-spacing: -0.5px;
        }
        .brand-name span {
            color: #0d47a1;
        }
        .brand-tagline {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .card {
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .card-header {
            padding: 36px 40px 30px;
            text-align: center;
        }
        .card-header .icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: block;
        }
        .card-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            line-height: 1.3;
        }
        .card-header p {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            margin-top: 6px;
        }
        .card-body {
            padding: 36px 40px;
        }
        .card-body p {
            font-size: 15px;
            color: #444444;
            line-height: 1.7;
            margin-bottom: 16px;
        }
        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            background-color: #f8fafc;
            border-radius: 8px;
            overflow: hidden;
        }
        .details-table tr {
            border-bottom: 1px solid #eef2f7;
        }
        .details-table tr:last-child {
            border-bottom: none;
        }
        .details-table td {
            padding: 12px 16px;
            font-size: 14px;
        }
        .details-table td:first-child {
            font-weight: 600;
            color: #555;
            width: 38%;
            background-color: #f1f5f9;
        }
        .details-table td:last-child {
            color: #333;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .btn {
            display: block;
            width: fit-content;
            margin: 28px auto 8px;
            padding: 14px 36px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            letter-spacing: 0.3px;
        }
        .alert-box {
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 13.5px;
            line-height: 1.6;
            margin-top: 20px;
        }
        .divider {
            border: none;
            border-top: 1px solid #eef2f7;
            margin: 24px 0;
        }
        .card-footer {
            background-color: #f8fafc;
            border-top: 1px solid #eef2f7;
            padding: 20px 40px;
            text-align: center;
        }
        .card-footer p {
            font-size: 12px;
            color: #999;
            line-height: 1.6;
        }
        .card-footer a {
            color: #1a73e8;
            text-decoration: none;
        }
        .social-links {
            margin-top: 10px;
        }
        .footer-brand {
            font-weight: 700;
            color: #1a73e8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="brand">
            <div class="brand-name">Med<span>Notice</span></div>
            <div class="brand-tagline">Healthcare Appointment System</div>
        </div>

        <div class="card">
            {% block header %}{% endblock %}

            <div class="card-body">
                {% block content %}{% endblock %}
            </div>

            <div class="card-footer">
                <p class="footer-brand">MedNotice</p>
                <p>
                    This is an automated message, please do not reply.<br>
                    &copy; {% now "Y" %} MedNotice. All rights reserved.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
